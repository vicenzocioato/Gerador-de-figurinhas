<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Grêmio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="all">
        <div id="bandeira">
            <div id="faixazul">INSERIR</div>
            <div id="faixabranca">O SEU</div>
            <div id="faixapreta">TEXTO</div>
        </div>
        <div id="download"><i class="fa-solid fa-download"></i></div>

        <form action="#" method="get">

            <div id="col">
                <input type="text" placeholder="Texto de cima">
                <input type="text" placeholder="Texto do meio">
                <input type="text" placeholder="Texto de baixo">
            </div>

            <button type='submit'>Gerar trapo</button>
        </form>

    </div>
    <script src="script.js"></script>
</body>

</html>
