<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Grêmio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="all">
        <div id="bandeira">
            <div id="faixazul"></div>
            <div id="faixabranca"></div>
            <div id="faixapreta"></div>
        </div>
        <button id="download"><i class="fa-solid fa-download"></i></button>

        <form action="#" method="get">

            <div id="col">
                <input type="text" id="textocima" placeholder="Texto de cima" maxlength="14">
                <input type="text" placeholder="Texto do meio" id="textomeio" maxlength="14">
                <input type="text" placeholder="Texto de baixo" id="textobaixo" maxlength="14">
            </div>
        </form>

    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>

</html>
